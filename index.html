<body><main>
<div class="row sp"><div><h1>🥗 FitScan</h1><div class="sub" id="dt"></div></div><button class="s" id="th">◐</button></div>

<section class="sec on" id="today"></section>

<section class="sec" id="scan">
<div class="g"><h2>What are we scanning?</h2><div class="row" id="modes"></div>
<div class="row" style="margin-top:12px" id="slots"></div>
<div class="f" style="margin-top:10px"><label>Food name / note (optional – works alone for a quick lookup, e.g. “msemen with honey”)</label><input id="note" placeholder="tagine, harira, khobz…"></div>
<button style="width:100%;margin-top:12px" id="go">✨ Analyze</button><div class="sub" id="msg" style="margin-top:8px"></div></div>
<div id="res"></div></section>

<section class="sec" id="gym"></section>
<section class="sec" id="me"></section>
</main>
<nav id="nav"><button data-t="today" class="on">🏠 Today</button><button data-t="scan">📸 Scan</button><button data-t="gym">🏋️ Gym</button><button data-t="me">🎯 Goals</button></nav>
<datalist id="ex"><option>Bench Press<option>Squat<option>Deadlift<option>Overhead Press<option>Barbell Row<option>Pull-up<option>Lat Pulldown<option>Incline Dumbbell Press<option>Leg Press<option>Bicep Curl<option>Triceps Pushdown<option>Lateral Raise<option>Romanian Deadlift<option>Hip Thrust</datalist>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K="fitscan1";
let S={p:{sex:"m",age:25,h:175,w:75,act:1.55,goal:"lose",gw:70,phys:"Lean & athletic"},food:[],gym:[],wt:[],saved:[]};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const day=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tdee=()=>{const p=S.p;return Math.round((10*p.w+6.25*p.h-5*p.age+(p.sex=="m"?5:-161))*p.act)};
const target=()=>tdee()+({lose:-500,gain:300,maintain:0}[S.p.goal]);
$("#dt").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
$("#th").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--tx").trim()=="#f1f3ff";d.dataset.theme=dark?"light":"dark"};

/* ---------- Today ---------- */
function rToday(){
 const d=day(),L=S.food.filter(x=>x.d==d),sum=k=>Math.round(L.reduce((a,x)=>a+(+x[k]||0),0)),e=sum("kcal"),T=target(),M=tdee(),C=2*Math.PI*52;
 const by={};S.food.forEach(x=>{if(x.d<d)by[x.d]=(by[x.d]||0)+x.kcal});
 const ds=Object.keys(by),net=ds.reduce((a,k)=>a+by[k]-M,0),kg=net/7700;
 const est=ds.length?`<div class="big ${kg>0?"neg":"pos"}">${kg>0?"+":""}${kg.toFixed(2)} kg</div><div class="sub">Estimated change over ${ds.length} logged day(s) vs. your maintenance (${M} kcal). Based on estimates, so treat it as a trend, not a scale.</div>`:`<div class="sub">Log a full day to see your estimated weight change.</div>`;
 $("#today").innerHTML=`<div class="g"><div class="ring"><svg viewBox="0 0 120 120"><defs><linearGradient id="gr"><stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#14c8a8"/></linearGradient></defs><circle class="tr" cx="60" cy="60" r="52"/><circle class="pr" cx="60" cy="60" r="52" stroke-dasharray="${Math.min(e/T,1)*C} ${C}" transform="rotate(-90 60 60)"/></svg><div class="t"><b>${e}</b><span class="sub">of ${T} kcal</span></div></div>
 <div class="st"><div><b>${Math.max(T-e,0)}</b><span class="sub">left</span></div><div><b>${M}</b><span class="sub">maintenance</span></div><div><b>${e-M>0?"+":""}${e-M}</b><span class="sub">vs maint.</span></div></div>
